<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f7f2ee;
font-family:'Cormorant Garamond', serif;
color:#6d6159;
overflow-x:hidden;
}

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
animation:fadeIn 2s ease;
}

.hero-content{
max-width:700px;
}

.subtitle{
letter-spacing:4px;
font-size:14px;
margin-bottom:20px;
animation:slideUp 1.5s ease;
}

.name{
font-family:'Great Vibes', cursive;
font-size:90px;
animation:slideUp 2s ease;
}

.amp{
font-size:40px;
margin:10px 0;
}

.date{
font-size:26px;
margin-top:25px;
animation:fadeIn 3s ease;
}

.section{
padding:100px 25px;
text-align:center;
}

.title{
font-size:48px;
margin-bottom:20px;
}

.text{
max-width:700px;
margin:auto;
font-size:28px;
line-height:1.7;
}

.countdown{
display:flex;
justify-content:center;
gap:30px;
margin-top:40px;
flex-wrap:wrap;
}

.box{
background:white;
padding:25px;
border-radius:20px;
min-width:120px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.number{
font-size:50px;
font-weight:bold;
}

.label{
font-size:18px;
letter-spacing:2px;
}
