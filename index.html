<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mina & Mariam</title>

<link href="https://fonts.+Garamond:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Cormorant Garamond',serif;
background:#f4efeb;
overflow-x:hidden;
}

#welcome{
position:fixed;
inset:0;
background:#f4efeb;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}

.cover{
width:100%;
height:85vh;
object-fit:contain;
background:#f4efeb;
}

.open-btn{
background:#7a6a60;
color:white;
border:none;
padding:15px 60px;
border-radius:40px;
font-size:24px;
cursor:pointer;
margin-top:15px;
}

.heart{
position:fixed;
font-size:28px;
pointer-events:none;
animation:fly 2s linear forwards;
z-index:10000;
}

@keyframes fly{
0%{
opacity:1;
transform:translateY(0) scale(1);
}
100%{
opacity:0;
transform:translateY(-450px) scale(2);
}
}

.hero{
height:100vh;
background:url('cover.jpg');
background-size:contain;
background-repeat:no-repeat;
background-position:center;
background-color:#f4efeb;
}

.section{
padding:80px 20px;
text-align:center;
}

.section h2{
font-size:48px;
color:#7a6a60;
margin-bottom:30px;
}

.countdown{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

.box{
background:white;
padding:20px;
border-radius:20px;
min-width:120px;
box-shadow:0 10px 20px rgba(0,0,0,.08);
}

.num{
font-size:40px;
font-weight:bold;
color:#7a6a60;
}

.label{
font-size:14px;
letter-spacing:2px;
}

.details{
font-size:28px;
line-height:1.8;
color:#7a6a60;
}

.btn{
display:inline-block;
margin-top:25px;
padding:15px 35px;
background:#7a6a60;
color:white;
text-decoration:none;
border-radius:35px;
}

footer{
padding:60px 20px;
text-align:center;
font-size:28px;
color:#7a6a60;
}

</style>
</head>

<body>

<div id="welcome">

<img src="cover.jpg" class="cover">

<button class="open-btn" onclick="openInvitation()">
Open Invitation
</button>

</div>

<div id="main" style="display:none;">

<section class="hero"></section>

<section class="section">

<h2>Countdown To Forever</h2>

<div class="countdown">

<div class="box">
<div class="num" id="days">0</div>
<div class="label">DAYS</div>
</div>

<div class="box">
<div class="num" id="hours">0</div>
<div class="label">HOURS</div>
</div>

<div class="box">
<div class="num" id="minutes">0</div>
<div class="label">MINUTES</div>
</div>

<div class="box">
<div class="num" id="seconds">0</div>
<div class="label">SECONDS</div>
</div>

</div>

</section>

<section class="section">

<h2>Event Details</h2>

<div class="details">

The Gabriel Hotel<br>
Sun City Mall<br>
Sheraton, Cairo

<br><br>

September 11, 2027<br>
7:00 PM

</div>

<a
class="btn"
href="https://maps.app.goo.gl/UY46pTsuEk5c4hS58?g_st=ic"
target="_blank">
Open Location
</a>

</section>

<footer>

We cannot wait to celebrate with you 🤍

<br><br>

Mina & Mariam

</footer>

</div>

<script>

function openInvitation(){

for(let i=0;i<60;i++){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="🤍";

heart.style.left=Math.random()*100+"vw";
heart.style.top=Math.random()*100+"vh";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},2000);
}

setTimeout(()=>{

document.getElementById("welcome").style.display="none";
document.getElementById("main").style.display="block";

},1500);

}

const targetDate = new Date("September 11, 2027 19:00:00").getTime();

setInterval(function(){

const now = new Date().getTime();
const distance = targetDate - now;

document.getElementById("days").innerHTML =
Math.floor(distance/(1000*60*60*24));

document.getElementById("hours").innerHTML =
Math.floor((distance%(1000*60*60*24))/(1000*60*60));

document.getElementById("minutes").innerHTML =
Math.floor((distance%(1000*60*60))/(1000*60));

document.getElementById("seconds").innerHTML =
Math.floor((distance%(1000*60))/1000);

},1000);

</script>

</body>
</html>
