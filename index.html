<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Georgia,serif;
overflow-x:hidden;
background:#f7f2ee;
}

#intro{
position:fixed;
inset:0;
background:#f7f2ee;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
}

.heart{
font-size:90px;

animation:pulse 1.5s infinite;
}

.tap{
margin-top:15px;
font-size:24px;
color:#6b5f58;
}

.hero{
height:100vh;
background:
linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
url('cover.jpg');
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
padding:20px;
}

.hero h1{
font-size:70px;

}

.hero p{
font-size:26px;
}

.section{
padding:80px 20px;
text-align:center;
}

.title{
font-size:45px;
margin-bottom:20px;
color:#6b5f58;
}

.text{
max-width:700px;
margin:auto;
font-size:26px;
line-height:1.8;
color:#6b5f58;
}

.countdown{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-top:30px;
}

.box{
background:white;
padding:20px;
border-radius:20px;
min-width:120px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.num{
font-size:42px;
font-weight:bold;
}

.btn{
display:inline-block;
margin-top:30px;
padding:15px 30px;
background:#6b5f58;
color:white;
text-decoration:none;
border-radius:40px;
}

@keyframes pulse{
50%{transform:scale(1.15);}
}
</style>
</head>

<body>

<div class="heart" onclick="openInvite()">❤️</div>
<div class="tap">Tap To Open</div>
</div>
