<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mina & Mariam</title>

<style>

body{
    margin:0;
    background:#e5d7cb;
    font-family:Georgia,serif;
}

#welcome{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    background:#f8f4ef;
    width:340px;
    padding:60px 30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.15);
}

.circle{
    width:70px;
    height:70px;
    background:#7b675d;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    margin-top:-90px;
    font-size:28px;
    color:white;
}

h1{
    font-size:54px;
    color:#7b675d;
    font-weight:normal;
    line-height:1.2;
}

.date{
    font-size:20px;
    color:#9a8c84;
    margin:25px 0;
}

.quote{
    font-size:20px;
    color:#8d817a;
    margin-bottom:30px;
}

button{
    background:#7b675d;
    color:white;
    border:none;
    padding:15px 50px;
    border-radius:40px;
    font-size:22px;
    cursor:pointer;
}

.floating{
    position:fixed;
    font-size:30px;
    animation:fly 2s forwards;
    pointer-events:none;
}

@keyframes fly{
    0%{
        opacity:1;
        transform:translateY(0);
    }

    100%{
        opacity:0;
        transform:translateY(-400px);
    }
}

</style>
</head>

<body>

<div id="welcome">

<div class="card">

<div class="circle">🤍</div>

<h1>
Mina
<br>
&
<br>
Mariam
</h1>

<div class="date">
September 11, 2027
</div>

<div class="quote">
And so, our forever begins ✨
</div>

<button onclick="openInvite()">
Open
</button>

</div>

</div>

<script>

function openInvite(){

for(let i=0;i<40;i++){

let heart=document.createElement("div");

heart.className="floating";

heart.innerHTML="❤";

heart.style.left=Math.random()*100+"vw";

heart.style.top=Math.random()*100+"vh";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},2000);

}

}

</script>

</body>
</html>
